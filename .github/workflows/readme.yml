name: README lists

# The lists of README.md are written from the catalog by scripts/readme_catalog.py.
# They are refreshed here, after a merge, and not checked on pull requests: a
# contributor only adds the folder of an entry, and two open pull requests never
# conflict on the README.
#
# The push below needs the branch rules of 'main' to let github-actions[bot]
# push directly (or to be bypassed by it).

on:
  push:
    branches: [main]
    paths:
      - "equipment/**"
      - "supplements/**"
      - "parameters/**"
      - "scripts/catalog.py"
      - "scripts/readme_catalog.py"
  workflow_dispatch:

permissions:
  contents: write

# One refresh at a time; a run always starts from the latest main
concurrency:
  group: readme-lists
  cancel-in-progress: false

jobs:
  readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Refresh the lists
        run: python scripts/readme_catalog.py
      - name: Commit the README
        run: |
          if git diff --quiet -- README.md; then
            echo "README lists already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: refresh the catalog lists of the README"
          git push origin HEAD:main
